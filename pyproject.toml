[project]
name = "deff"
version = "0.6.1"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.0",
    "sqlglot>=30.8.0",
]

[dependency-groups]
dev = [
    "fsspec>=2026.4.0",
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
    "pytest>=9.0.3",
    "tabulate>=0.10.0",
    "pandas>=3.0.3",
    "jupyter>=1.1.1",
]

[tool.setuptools.packages.find]
include = ["deff*"]
